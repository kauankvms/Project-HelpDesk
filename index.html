<!doctype html>
<html>
  <head>
    <title>Help Desk</title>
    <link rel="stylesheet" href="css/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <main>
      <section class="painel-login">
        <div class="card-login">
          <img src="imagens/HelpDesk.png" alt="Logo Help Desk" class="logo" />

          <h2>Faça login para sua conta</h2>

          <form>
            <div class="campo">
              <label for="usuario">Usuário</label>
              <div class="input-icon">
                <svg viewBox="0 0 24 24" class="icon">
                  <path
                    d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"
                  />
                </svg>
                <input type="text" id="usuario" name="usuario" required />
              </div>
            </div>

            <div class="campo">
              <div class="linha-senha">
                <label for="senha">Senha</label>
                <a href="#">Esqueci minha senha</a>
              </div>
              <div class="input-icon">
                <svg viewBox="0 0 24 24" class="icon">
                  <path
                    d="M12 2a5 5 0 00-5 5v3H6a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2v-8a2 2 0 00-2-2h-1V7a5 5 0 00-5-5zm-3 8V7a3 3 0 016 0v3H9z"
                  />
                </svg>
                <input type="password" id="senha" name="senha" required />
                <button type="button" id="btn-olho" aria-label="Mostrar senha">
                  <svg viewBox="0 0 24 24" class="icon">
                    <path
                      d="M12 5c-5.5 0-9.6 4.4-11 7 1.4 2.6 5.5 7 11 7s9.6-4.4 11-7c-1.4-2.6-5.5-7-11-7zm0 11.5A4.5 4.5 0 1112 7.5a4.5 4.5 0 010 9z"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <div class="campo">
              <label for="origem">Origem de login</label>
              <select id="origem" name="origem">
                <option value="local">Banco de dados do HelpDesk</option>
                <option value="ad">Active Directory</option>
              </select>
            </div>

            <div class="campo campo-checkbox">
              <input type="checkbox" id="lembrar" name="lembrar" />
              <label for="lembrar">Lembrar de mim</label>
            </div>

            <div class="campo">
              <button type="submit" class="btn-entrar">Entrar</button>
            </div>
          </form>
        </div>
      </section>
    </main>
    <script src="js/login.js"></script>
  </body>
</html>
